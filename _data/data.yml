career-profile:
    title: About Me
    summary: |
      I am currently a Ph.D. student at the Data Systems Lab at Pohang University of Science and Technology (POSTECH), advised by Professor Wook-Shin Han. I will graduate in February 2026 and begin my postdoctoral position at POSTECH in March 2026. My research interests include continuous subgraph matching, incremental cardinality estimation, and query optimization.


